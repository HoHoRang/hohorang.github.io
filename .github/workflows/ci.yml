name: CI

# main 외의 브랜치에 push하면 타입 검사와 빌드를 돌린다. frontmatter 오타(카테고리 등)도 여기서 걸러진다.
# PR의 head 커밋에 이 결과가 붙으므로 pull_request 트리거는 쓰지 않는다.
# (봇이 연 PR의 pull_request 실행은 수동 승인을 기다리며 멈춰 있기 때문)
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
